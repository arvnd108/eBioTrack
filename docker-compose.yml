# Owner: A (Backend)
# Purpose: Local PostgreSQL for development and tests
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebiotrack
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: ebiotrack
    ports:
      - "5432:5432"
    volumes:
      - ebiotrack_pgdata:/var/lib/postgresql/data
      # Creates the ebiotrack_test database on first start (empty volume only).
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check (-h) so it only passes once the real server, not the init-time socket-only one, is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ebiotrack -d ebiotrack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ebiotrack_pgdata:
