# Owner: C (Testing & QA)
# Purpose: CI pipeline (lint, migrate test DB, run tests)
name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback, no database needed.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json
      - name: Backend lint and format
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run format
      - name: Tests lint and format
        working-directory: tests
        run: |
          npm ci
          npm run lint
          npm run format
      # The frontend scaffold may not exist yet (T08); skip visibly instead of failing.
      - name: Frontend lint (if defined)
        run: |
          if [ -f frontend/package.json ] && node -e "process.exit(require('./frontend/package.json').scripts?.lint ? 0 : 1)"; then
            cd frontend && npm ci && npm run lint
          else
            echo "::notice::frontend has no lint script yet; skipping"
          fi

  # Runs in parallel with lint (no needs:) so both failures show up in one run.
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebiotrack
          # Throwaway value for this ephemeral CI-only container; not a real secret.
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: ebiotrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebiotrack -d ebiotrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://ebiotrack:change_me@localhost:5432/ebiotrack_test
      # Distinct from TEST_DATABASE_URL (env.js rejects equal values); never used when NODE_ENV=test.
      DATABASE_URL: postgres://ebiotrack:change_me@localhost:5432/ebiotrack
      SESSION_SECRET: ci-throwaway-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install tests dependencies
        working-directory: tests
        run: npm ci
      # Proves the schema builds on an empty database.
      - name: Build database from scratch
        working-directory: backend
        run: |
          node src/db/migrate.js --reset --seed
          node src/db/migrate.js --status
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Tests suites
        working-directory: tests
        run: npm test
      - name: Save schema listing
        if: failure()
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=change_me psql -h localhost -U ebiotrack -d ebiotrack_test -c '\dt' > schema-listing.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-failure-diagnostics
          path: schema-listing.txt
          if-no-files-found: ignore
